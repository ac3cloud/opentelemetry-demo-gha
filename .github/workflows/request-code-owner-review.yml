name: Request Code Owner Review

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  request-review:
    name: Request Code Owner Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Request Digital Team review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api \
            --method POST \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f team_reviewers[]=digital-team
